<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveMod Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px 0 16px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #e0e0e0);
            margin-bottom: 16px;
        }
        .header .logo {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #3390ec, #5c9ce6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #8e8e8e);
            margin-top: 4px;
        }
        .status-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-card .left .label {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #8e8e8e);
        }
        .status-card .left .value {
            font-weight: 600;
            font-size: 16px;
            margin-top: 2px;
        }
        .status-card .right {
            text-align: right;
        }
        .status-card .right .label {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #8e8e8e);
        }
        .status-card .right .value {
            font-weight: 600;
            font-size: 16px;
        }
        .badge-premium {
            color: #ffd700;
        }
        .badge-free {
            color: var(--tg-theme-hint-color, #8e8e8e);
        }
        .section {
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #8e8e8e);
            margin-bottom: 8px;
            padding-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .btn-grid.two-col {
            grid-template-columns: 1fr 1fr;
        }
        .btn {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
            border: none;
            border-radius: 10px;
            padding: 12px 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            line-height: 1.3;
        }
        .btn:active {
            transform: scale(0.95);
            opacity: 0.7;
        }
        .btn .emoji {
            display: block;
            font-size: 22px;
            margin-bottom: 2px;
        }
        .btn .label {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #8e8e8e);
        }
        .btn-primary {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .btn-primary .label {
            color: var(--tg-theme-button-text-color, #ffffff);
            opacity: 0.8;
        }
        .btn-success {
            background: #34c759;
            color: #ffffff;
        }
        .btn-success .label {
            color: #ffffff;
            opacity: 0.8;
        }
        .btn-full {
            grid-column: 1 / -1;
        }
        .divider {
            height: 1px;
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            margin: 12px 0;
        }
        .premium-block {
            background: linear-gradient(135deg, #ffd70015, #ffd70008);
            border: 1px solid #ffd70040;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }
        .premium-block .title {
            font-weight: 600;
            font-size: 15px;
            color: #ffd700;
        }
        .premium-block .desc {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #8e8e8e);
            margin-top: 4px;
        }
        .premium-block .prices {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .premium-block .prices .price-btn {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: var(--tg-theme-text-color, #000000);
            flex: 1;
            min-width: 70px;
            text-align: center;
        }
        .premium-block .prices .price-btn:active {
            transform: scale(0.95);
        }
        .premium-block .prices .price-btn .star {
            color: #ffd700;
        }
        .footer {
            text-align: center;
            padding: 16px 0 8px;
            border-top: 1px solid var(--tg-theme-secondary-bg-color, #e0e0e0);
            margin-top: 16px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #8e8e8e);
        }
        .footer a {
            color: var(--tg-theme-button-color, #3390ec);
            text-decoration: none;
        }
        .tg-link {
            color: var(--tg-theme-button-color, #3390ec);
            font-weight: 500;
        }
        @media (max-width: 400px) {
            .btn-grid {
                grid-template-columns: 1fr 1fr;
            }
            .btn-grid .btn-full {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="logo">🤖</span>
        <h1>SaveMod Bot</h1>
        <div class="sub">Управляй ботом из мини-приложения</div>
    </div>

    <div class="status-card">
        <div class="left">
            <div class="label">📊 Твой статус</div>
            <div class="value" id="statusText">🆓 Бесплатный</div>
        </div>
        <div class="right">
            <div class="label">📌 Команды</div>
            <div class="value" id="commandsCount">0 / 3</div>
        </div>
    </div>

    <!-- PREMIUM БЛОК (как в SaveMod) -->
    <div class="premium-block">
        <div class="title">⭐ SaveMOD Premium</div>
        <div class="desc">Безлимит на все команды • Приоритетная обработка</div>
        <div class="prices">
            <button class="price-btn" onclick="buyPremium(50, '1 месяц')"><span class="star">⭐</span> 1м — 50</button>
            <button class="price-btn" onclick="buyPremium(150, '3 месяца')"><span class="star">⭐</span> 3м — 150</button>
            <button class="price-btn" onclick="buyPremium(250, '12 месяцев')"><span class="star">⭐</span> 12м — 250</button>
            <button class="price-btn" onclick="buyPremium(500, 'навсегда')"><span class="star">⭐</span> ∞ — 500</button>
        </div>
    </div>

    <!-- КОМАНДЫ (как в Cisgram) -->
    <div class="section">
        <div class="section-title">📝 Быстрые команды</div>
        <div class="btn-grid">
            <button class="btn" onclick="sendCommand('.love')">
                <span class="emoji">❤️</span> Любовь
            </button>
            <button class="btn" onclick="sendCommand('.troll')">
                <span class="emoji">🤬</span> Тролль
            </button>
            <button class="btn" onclick="sendCommand('.flip')">
                <span class="emoji">🪙</span> Монетка
            </button>
            <button class="btn" onclick="sendCommand('.dice')">
                <span class="emoji">🎲</span> Кубик
            </button>
            <button class="btn" onclick="sendCommand('.zaebu')">
                <span class="emoji">🎵</span> Заёбушка
            </button>
            <button class="btn" onclick="sendCommand('.sw Привет')">
                <span class="emoji">🔄</span> Смена раскладки
            </button>
            <button class="btn btn-full btn-primary" onclick="sendCommand('.buy')">
                💎 Купить Premium
            </button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="section">
        <div class="section-title">🎨 Форматирование</div>
        <div class="btn-grid two-col">
            <button class="btn" onclick="sendCommandWithText('.bold')">
                <span class="emoji">🔤</span> Bold
            </button>
            <button class="btn" onclick="sendCommandWithText('.italic')">
                <span class="emoji">📝</span> Italic
            </button>
            <button class="btn" onclick="sendCommandWithText('.monospace')">
                <span class="emoji">⌨️</span> Monospace
            </button>
            <button class="btn" onclick="sendCommandWithText('.underline')">
                <span class="emoji">📏</span> Underline
            </button>
            <button class="btn" onclick="sendCommandWithText('.leet')">
                <span class="emoji">🔢</span> Leet
            </button>
            <button class="btn" onclick="sendCommand('.type Привет')">
                <span class="emoji">✍️</span> Type
            </button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="section">
        <div class="section-title">🎮 Игры</div>
        <div class="btn-grid two-col">
            <button class="btn" onclick="sendCommand('.ttt @username')">
                <span class="emoji">❌</span> Крестики-нолики
            </button>
            <button class="btn" onclick="sendCommand('.duel @username 10')">
                <span class="emoji">⚔️</span> Дуэль
            </button>
            <button class="btn" onclick="sendCommand('.chk @username')">
                <span class="emoji">♟️</span> Шашки
            </button>
            <button class="btn" onclick="sendCommand('.bw')">
                <span class="emoji">🎨</span> Закрась поле
            </button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="section">
        <div class="section-title">🔍 Полезное</div>
        <div class="btn-grid two-col">
            <button class="btn" onclick="sendCommand('.afk Отошёл')">
                <span class="emoji">🌙</span> AFK
            </button>
            <button class="btn" onclick="sendCommand('.status Онлайн')">
                <span class="emoji">📌</span> Статус
            </button>
            <button class="btn" onclick="sendCommand('.time')">
                <span class="emoji">🕐</span> Время в имя
            </button>
            <button class="btn" onclick="sendCommand('.nk')">
                <span class="emoji">🐱</span> Неко-тян
            </button>
            <button class="btn" onclick="sendCommand('.short')">
                <span class="emoji">📝</span> Пересказ
            </button>
            <button class="btn" onclick="sendCommand('.dox @username')">
                <span class="emoji">🕵️</span> Досье
            </button>
            <button class="btn btn-full" onclick="sendCommand('.help')">
                <span class="emoji">❓</span> Все команды
            </button>
        </div>
    </div>

    <div class="footer">
        SaveMod Bot • <span id="version">v3.0</span> • 
        <a href="#" onclick="sendCommand('/start'); return false;">🔄 Открыть бота</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // ============ ОТПРАВКА КОМАНД ============
        function sendCommand(cmd) {
            tg.sendData(JSON.stringify({ command: cmd }));
            tg.close();
        }

        function sendCommandWithText(cmd) {
            const text = prompt('Введите текст:');
            if (text !== null && text.trim() !== '') {
                tg.sendData(JSON.stringify({ command: cmd + ' ' + text.trim() }));
                tg.close();
            }
        }

        function buyPremium(amount, title) {
            const confirmText = `💎 Купить Premium — ${title}\n\n⭐ Стоимость: ${amount} звёзд\n\nПодтверждаешь покупку?`;
            if (confirm(confirmText)) {
                tg.sendData(JSON.stringify({ 
                    command: `.buy_premium ${amount} ${title}`
                }));
                tg.close();
            }
        }

        // ============ ПОЛУЧЕНИЕ СТАТИСТИКИ ============
        tg.onEvent('mainButtonClicked', function() {
            tg.sendData(JSON.stringify({ action: 'get_stats' }));
        });

        // Обновление статуса из бота
        window.updateStats = function(stats) {
            if (stats.is_premium) {
                document.getElementById('statusText').innerHTML = '⭐ Premium';
                document.getElementById('statusText').className = 'value badge-premium';
            } else {
                document.getElementById('statusText').innerHTML = '🆓 Бесплатный';
                document.getElementById('statusText').className = 'value badge-free';
            }
            document.getElementById('commandsCount').textContent = (stats.daily_commands || 0) + ' / 3';
        };

        // ============ ПОЛУЧЕНИЕ ДАННЫХ ОТ БОТА ============
        tg.ready();

        // Если бот присылает данные через sendData
        document.addEventListener('DOMContentLoaded', function() {
            // Запрашиваем статистику при открытии
            tg.sendData(JSON.stringify({ action: 'get_stats' }));
        });

        // Обработка входящих данных от бота
        tg.onEvent('popupClosed', function(data) {
            // Можно обрабатывать ответы от бота
        });

        // Версия
        document.getElementById('version').textContent = 'v' + (new Date().getFullYear());
    </script>
</body>
</html>
